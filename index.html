<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu Ngữ pháp Thông minh</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <div class="max-w-4xl mx-auto px-4 py-10">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-600 mb-2">Tra Cứu Ngữ Pháp Tiếng Anh</h1>
            <p class="text-slate-500">Nhập từ khóa hoặc điểm ngữ pháp bạn muốn tìm kiếm để hệ thống quét trực tiếp từ tài liệu.</p>
        </div>

        <!-- Search Box -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6 flex gap-3">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Ví dụ: inversion, conditional sentences, past simple..." 
                class="flex-1 px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-lg"
                onkeypress="handleKeyPress(event)"
            >
            <button 
                onclick="searchPDF()" 
                id="searchBtn"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-medium transition-colors"
            >
                Tra cứu
            </button>
        </div>

        <!-- Status / Loading -->
        <div id="statusBox" class="text-center py-4 text-slate-500 font-medium">
            Đang tải tài liệu, vui lòng đợi trong giây lát...
        </div>

        <!-- Results Section -->
        <div id="resultsContainer" class="space-y-4"></div>
    </div>

    <script>
        let pdfDoc = null;
        let totalPages = 0;
        let pdfTextContent = []; // Lưu trữ nội dung từng trang

        // Đổi tên file PDF của bạn ở đây nếu cần (mặc định là sach.pdf)
        const PDF_URL = 'sach.pdf'; 

        async function loadPDF() {
            try {
                const loadingTask = pdfjsLib.getDocument(PDF_URL);
                pdfDoc = await loadingTask.promise;
                totalPages = pdfDoc.numPages;
                
                document.getElementById('statusBox').innerText = `Đã tải xong tài liệu (${totalPages} trang). Hãy nhập từ khóa để tra cứu!`;

                // Đọc trước text của tất cả các trang ngầm bên dưới
                for (let i = 1; i <= totalPages; i++) {
                    let page = await pdfDoc.getPage(i);
                    let textContent = await page.getTextContent();
                    let text = textContent.items.map(item => item.str).join(' ');
                    pdfTextContent.push({ pageNumber: i, text: text });
                }
            } catch (error) {
                console.error(error);
                document.getElementById('statusBox').innerText = 'Không tìm thấy file "sach.pdf" hoặc lỗi tải file. Hãy kiểm tra lại tên file trên GitHub!';
                document.getElementById('statusBox').classList.add('text-red-500');
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchPDF();
            }
        }

        function searchPDF() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';

            if (!keyword) {
                alert('Vui lòng nhập từ khóa cần tìm!');
                return;
            }

            if (pdfTextContent.length === 0) {
                alert('Tài liệu chưa tải xong, vui lòng đợi một chút.');
                return;
            }

            let results = [];

            // Tìm kiếm trong từng trang
            pdfTextContent.forEach(item => {
                let lowerText = item.text.toLowerCase();
                if (lowerText.includes(keyword)) {
                    results.push(item);
                }
            });

            // Hiển thị kết quả
            if (results.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl shadow-sm text-center text-slate-500">Không tìm thấy kết quả nào phù hợp với từ khóa "<strong>${keyword}</strong>".</div>`;
                return;
            }

            let html = `<p class="text-sm font-semibold text-slate-500 mb-3">Tìm thấy kết quả ở ${results.length} trang:</p>`;
            
            results.forEach(res => {
                // Trích đoạn ngắn xung quanh từ khóa cho đẹp
                let index = res.text.toLowerCase().indexOf(keyword);
                let start = Math.max(0, index - 100);
                let end = Math.min(res.text.length, index + 200);
                let snippet = res.text.substring(start, end);

                html += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:border-indigo-300 transition-all">
                        <div class="flex justify-between items-center mb-2">
                            <span class="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full">Trang ${res.pageNumber}</span>
                        </div>
                        <p class="text-slate-600 text-sm leading-relaxed">...${snippet}...</p>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Tự động chạy khi load trang
        window.onload = loadPDF;
    </script>
</body>
</html>
